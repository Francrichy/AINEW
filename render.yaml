services:
  - type: web
    name: AINEW
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SITE_URL
        value: https://www.mlimani.net
      - key: OPENROUTER_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: VIDEO_PROVIDER
        value: pollinations
      - key: OPENROUTER_VIDEO_MODEL
        value: bytedance/seedance-2.0
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_ETHAN_AVATAR_ID
        sync: false
      - key: LIVEAVATAR_NGINA_AVATAR_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false
      - key: PAY_INFO
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
