<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mlimani Admin</title>
<style>body{font-family:system-ui;background:#0e3b24;color:#1d2a1f;margin:0;padding:16px}.c{background:#fff8ea;border-radius:14px;padding:14px;margin:0 auto 12px;max-width:720px}input,select{padding:9px;border:2px solid #cfdcc2;border-radius:8px;margin:4px 4px 4px 0}button{padding:9px 14px;border:0;border-radius:999px;font-weight:700;cursor:pointer;background:#F2A900}.g{background:#1f7a42;color:#fff}.r{background:#C1572D;color:#fff}</style></head><body>
<div class="c"><h2>Mlimani Admin</h2><p><a href="/billing-admin.html">Fungua Wallet, Credits Ledger, Subscriptions na Admin Pricing →</a></p><input id="k" type="password" placeholder="ADMIN_KEY"><button onclick="load()">Ingia</button><div id="st"></div></div>
<div class="c"><h3>Malipo yanayosubiri</h3><div id="p">—</div></div>
<div class="c"><h3>Washa mpango wa zamani kwa mkono</h3><input id="gl" placeholder="Simu au barua pepe"><select id="gp"><option>kawaida</option><option>biashara</option><option>kampuni</option></select><input id="gd" type="number" value="30" style="width:70px"><button class="g" onclick="grant()">Washa</button><div id="gm"></div></div>
<script>
const $=s=>document.querySelector(s);const H=()=>({'Content-Type':'application/json','x-admin-key':$('#k').value});
const call=async(p,b)=>{const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:H(),body:b&&JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Hitilafu');return d};
async function load(){try{const s=await call('stats');$('#st').textContent=`Watumiaji: ${s.users} · Wanaolipa: ${s.paid} · Wanaosubiri: ${s.pending}`;const ps=await call('payments');const b=$('#p');b.innerHTML='';if(!ps.length)b.textContent='Hakuna malipo yanayosubiri.';
ps.forEach(p=>{const d=document.createElement('div');d.style.cssText='border-bottom:1px solid #ddd;padding:8px 0';d.textContent=`#${p.id} · ${p.plan==='wallet_topup'?'ONGEZA SALIO':'MALIPO YA ZAMANI'} · ${p.plan==='wallet_topup'?'TZS '+Number(p.amount_tzs||0).toLocaleString('sw-TZ'):p.plan} · ${p.uphone||p.email} · simu ${p.phone} · muamala ${p.ref} · ${new Date(p.created).toLocaleString()}`;
const a=document.createElement('button');a.className='g';a.textContent='Thibitisha';a.onclick=async()=>{await call('approve',{id:p.id});load()};const r=document.createElement('button');r.className='r';r.textContent='Kataa';r.onclick=async()=>{await call('reject',{id:p.id});load()};d.append(document.createElement('br'),a,' ',r);b.appendChild(d)})}catch(e){$('#st').textContent=e.message}}
async function grant(){try{await call('grant',{login:$('#gl').value,plan:$('#gp').value,days:+$('#gd').value});$('#gm').textContent='Imewashwa ✓';load()}catch(e){$('#gm').textContent=e.message}}
</script></body></html>
