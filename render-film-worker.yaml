services:
  - type: pserv
    name: mlimani-film-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --prefix film-worker --omit=dev
    startCommand: node film-worker/server.js
    disk:
      name: mlimani-film-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: FILM_DATA_DIR
        value: /var/data
      - key: AGNES_API_KEY
        sync: false
      - key: MLIMANI_INTERNAL_TOKEN
        sync: false
      - key: APP_CALLBACK_URL
        value: https://ainew-jju3.onrender.com/api/internal/film-job-update
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
