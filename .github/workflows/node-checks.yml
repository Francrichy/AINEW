name: Node checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server.js
      - run: node --check billing.js
      - name: Run tests when test files exist
        if: ${{ hashFiles('test/**/*.test.js', 'tests/**/*.test.js', 'test/**/*.spec.js', 'tests/**/*.spec.js', '*.test.js', '*.spec.js') != '' }}
        run: npm test
