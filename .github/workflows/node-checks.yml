name: Node checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check billing.js
      - name: Run tests when test folders exist
        run: |
          if [ -d test ] || [ -d tests ]; then npm test; else echo 'No test folder exists yet; skipping test command.'; fi
