name: Studio validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check Studio browser JavaScript syntax
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const paths = ['public/production-studio.html', 'public/studio-tools.html', 'public/studio-motion-avatar.html']; for (const path of paths) { const html = fs.readFileSync(path, 'utf8'); const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m => m[1]); if (!scripts.length) throw new Error('No inline Studio script found in ' + path); for (const script of scripts) new vm.Script(script); } console.log('Studio inline JavaScript syntax OK');"
      - name: Run Node test suite when test folders exist
        run: |
          if [ -d test ] || [ -d tests ]; then npm test; else echo 'No test folder exists yet; skipping test command.'; fi
